<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1030">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>给你的生日小宇宙</title>
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body data-bg="night" data-sky="on">

<!-- 全局星空画布（首页 / 星星 / 月亮 / 终幕使用） -->
<canvas id="sky" aria-hidden="true"></canvas>

<!-- 首页六枚图标的共用 SVG 图标 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 48 48">
      <path d="M24 6l5.2 11.2 12.3 1.5-9 8.4 2.4 12.2L24 33.6 13.1 39.3l2.4-12.2-9-8.4 12.3-1.5z"
            fill="currentColor" fill-opacity=".20" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 48 48">
      <path d="M31 5.5a18 18 0 1 0 11.5 29.5A15 15 0 0 1 31 5.5z"
            fill="currentColor" fill-opacity=".92" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="20" cy="17" r="2.2" fill="#0E1030" fill-opacity=".18"/>
      <circle cx="15.5" cy="26" r="1.6" fill="#0E1030" fill-opacity=".18"/>
    </symbol>
    <symbol id="i-gift" viewBox="0 0 48 48">
      <rect x="9" y="22" width="30" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <rect x="7.5" y="16.5" width="33" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M24 16.5V41" stroke="currentColor" stroke-width="2.2"/>
      <path d="M24 16c-3.5-7-12-4-9.5 1 1.8 3.4 6.5 1.5 9.5-1zM24 16c3.5-7 12-4 9.5 1-1.8 3.4-6.5 1.5-9.5-1z"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-cake" viewBox="0 0 48 48">
      <path d="M8 39q16 4.5 32 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="12" y="29" width="24" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M12 31q3 3 6 0t6 0 6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <rect x="16.5" y="21" width="15" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M16.5 23q3.75 3 7.5 0t7.5 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 21v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 10c2.4 2.6 1.4 5 0 5.6-1.4-.6-2.4-3 0-5.6z" fill="currentColor" fill-opacity=".75"/>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 48 48">
      <path d="M16 16l2-5h12l2 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="6" y="16" width="36" height="25" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="24" cy="28.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="24" cy="28.5" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="36.5" cy="21" r="1.6" fill="currentColor"/>
    </symbol>
    <symbol id="i-envelope" viewBox="0 0 48 48">
      <rect x="6" y="12" width="36" height="24" rx="3" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="2.2"/>
      <path d="M6.5 15L24 28.5 41.5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main id="stage">

  <!-- 0. 开场 -->
  <section class="scene" id="scene-intro" data-night>
    <div class="intro-inner">
      <div class="intro-spark">✦</div>
      <h1 class="intro-title" id="introTitle"></h1>
      <p class="intro-tap" id="introTap"></p>
    </div>
  </section>

  <!-- 1. 首页：六个散落的图标 -->
  <section class="scene" id="scene-home" data-night>
    <div class="home-top">记忆 · <span id="doneNum">0</span> / 6</div>
    <nav class="icon-field">
      <a class="orb" style="--x:19%;--y:15%;--r:-7deg;--d:.1s;--s:66px"  href="#/star"   data-key="star"  aria-label="星星">
        <svg><use href="#i-star"></use></svg><span class="orb-label">星星</span></a>
      <a class="orb" style="--x:74%;--y:12%;--r:5deg;--d:1.3s;--s:72px"  href="#/moon"   data-key="moon"  aria-label="月亮">
        <svg><use href="#i-moon"></use></svg><span class="orb-label">月亮</span></a>
      <a class="orb" style="--x:12%;--y:43%;--r:4deg;--d:.7s;--s:60px"  href="#/cake"   data-key="cake"  aria-label="小蛋糕">
        <svg><use href="#i-cake"></use></svg><span class="orb-label">小蛋糕</span></a>
      <a class="orb" style="--x:80%;--y:40%;--r:-5deg;--d:1.9s;--s:64px" href="#/gift"   data-key="gift"  aria-label="礼物">
        <svg><use href="#i-gift"></use></svg><span class="orb-label">礼物</span></a>
      <a class="orb" style="--x:27%;--y:70%;--r:6deg;--d:2.5s;--s:68px"  href="#/letter" data-key="letter" aria-label="信封">
        <svg><use href="#i-envelope"></use></svg><span class="orb-label">信封</span></a>
      <a class="orb" style="--x:68%;--y:72%;--r:-4deg;--d:3.1s;--s:62px" href="#/camera" data-key="camera" aria-label="相机">
        <svg><use href="#i-camera"></use></svg><span class="orb-label">相机</span></a>
    </nav>
    <p class="home-hint" id="homeHint"></p>
  </section>

  <!-- 2. ⭐ 星星 -->
  <section class="scene" id="scene-star" data-night>
    <div class="v-center" id="starTap">
      <p class="tease" id="starTease"></p>
      <div class="star-lines" id="starLines"></div>
    </div>
    <p class="tap-hint" id="starHint">轻触屏幕</p>
  </section>

  <!-- 3. 🌙 月亮 -->
  <section class="scene" id="scene-moon" data-night>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <button class="moon-btn" id="moonBtn" aria-label="播放或暂停音乐">
      <span class="moon-halo"></span>
      <svg viewBox="0 0 120 120" class="moon-svg" aria-hidden="true">
        <circle cx="60" cy="60" r="42" fill="#F4F1E4"/>
        <circle cx="46" cy="48" r="6.5" fill="#E2DAC4"/>
        <circle cx="70" cy="66" r="9" fill="#E2DAC4"/>
        <circle cx="52" cy="78" r="4.5" fill="#E2DAC4"/>
        <circle cx="74" cy="42" r="3.5" fill="#E2DAC4"/>
      </svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </button>
    <div class="song">
      <p class="song-title" id="songTitle"></p>
      <p class="song-sub" id="songSub"></p>
      <button class="pill light" id="musicToggle">暂停 ♪</button>
    </div>
    <p class="tap-hint" id="moonHint" hidden>点一下月亮开始听 ♪（iPhone 请确认静音键已打开）</p>
  </section>

  <!-- 4. 🎁 礼物 -->
  <section class="scene paper-scene" id="scene-gift" data-paper>
    <p class="lead-ink" id="giftLead"></p>
    <div class="gift-stage" id="giftStage">
      <span class="gift-glow"></span>
      <svg viewBox="0 0 200 200" class="gift-svg" aria-hidden="true">
        <rect class="gift-body" x="52" y="92" width="96" height="72" rx="9"/>
        <rect class="gift-rib-v" x="93" y="64" width="14" height="100"/>
        <g class="gift-lid">
          <rect x="44" y="64" width="112" height="22" rx="6"/>
        </g>
        <path class="gift-bow" d="M100 62c-5-11-18-8-15 0 2.5 6 10 4 15 0zm0 0c5-11 18-8 15 0-2.5 6-10 4-15 0z"/>
      </svg>
    </div>
    <div class="coupon-deck" id="couponDeck" hidden>
      <div class="coupon" id="couponCard"></div>
      <div class="coupon-dots" id="couponDots"></div>
      <button class="pill ink" id="couponNext">下一张 →</button>
      <p class="coupon-note" id="couponNote" hidden></p>
    </div>
    <p class="tap-hint ink" id="giftHint">点一下，拆开它</p>
  </section>

  <!-- 5. 🎂 小蛋糕 -->
  <section class="scene paper-scene" id="scene-cake" data-paper>
    <p class="lead-ink" id="cakeLead"></p>
    <div class="mini-cake-wrap" id="cakeWrap">
      <svg viewBox="0 0 260 200" class="mini-cake-svg" aria-hidden="true">
        <ellipse cx="130" cy="180" rx="102" ry="11" fill="#E7DEC9" stroke="#3A2E2A" stroke-width="2.2"/>
        <rect x="50" y="122" width="160" height="52" rx="11" fill="#FFF4E2" stroke="#3A2E2A" stroke-width="2.4"/>
        <path d="M50 134q10 9 20 0t20 0 20 0 20 0 20 0 20 0 20 0" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
        <rect x="72" y="86" width="116" height="40" rx="10" fill="#FFE9D6" stroke="#3A2E2A" stroke-width="2.4"/>
        <path d="M72 97q9.7 8 19.3 0t19.3 0 19.3 0 19.3 0 19.3 0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
        <rect x="92" y="54" width="76" height="34" rx="9" fill="#FFF6E8" stroke="#3A2E2A" stroke-width="2.4"/>
        <path d="M92 64q9.5 8 19 0t19 0 19 0 19 0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div class="topping-layer" id="toppingLayer"></div>
    </div>
    <p class="done-note" id="cakeDone" hidden></p>
    <div class="tray" id="tray"></div>
  </section>

  <!-- 6. 📷 相机 -->
  <section class="scene paper-scene" id="scene-camera" data-paper>
    <p class="lead-ink" id="camLead"></p>
    <div class="cam-area">
      <div class="photo-stack" id="photoStack"></div>
      <svg viewBox="0 0 220 150" class="cam-svg" aria-hidden="true">
        <rect x="30" y="32" width="20" height="10" rx="3" fill="#6E4536" stroke="#3A2E2A" stroke-width="2.2"/>
        <path d="M70 46l3-8h74l3 8" fill="none" stroke="#3A2E2A" stroke-width="2.4" stroke-linejoin="round"/>
        <rect x="16" y="44" width="188" height="92" rx="14" fill="#8A5A44" stroke="#3A2E2A" stroke-width="2.4"/>
        <circle cx="110" cy="90" r="31" fill="#3A2E2A"/>
        <circle cx="110" cy="90" r="23" fill="#7FB8D4"/>
        <circle cx="110" cy="90" r="23" fill="url(#lensShade)"/>
        <circle cx="102" cy="82" r="6" fill="#FFFFFF" fill-opacity=".55"/>
        <circle cx="178" cy="62" r="6" fill="#FFF6C8" stroke="#3A2E2A" stroke-width="1.8"/>
        <defs>
          <radialGradient id="lensShade" cx="50%" cy="45%" r="60%">
            <stop offset="55%" stop-color="#7FB8D4" stop-opacity="0"/>
            <stop offset="100%" stop-color="#243B46" stop-opacity=".55"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <button class="shutter" id="shutterBtn" aria-label="快门"><span></span></button>
    <p class="tap-hint ink" id="camHint">点快门，把记忆洗出来</p>
  </section>

  <!-- 7. ✉️ 信封（五幕） -->
  <section class="scene" id="scene-letter" data-letter>

    <div class="act act-1">
      <p class="letter-line center" id="act1Line"></p>
      <button class="open-btn" id="openLetter"></button>
    </div>

    <div class="act act-2">
      <div class="envelope" id="envelope">
        <span class="env-glow"></span>
        <span class="env-back"></span>
        <span class="env-paper">
          <span class="env-hi" id="envHi0"></span>
          <span class="env-hi" id="envHi1"></span>
        </span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
      </div>
      <p class="tap-hint" id="act2Hint" hidden>轻触继续</p>
    </div>

    <div class="act act-3">
      <p class="lead" id="act3Lead"></p>
      <div class="letter-cards" id="letterCards"></div>
      <button class="pill light to-final" id="toFinal" hidden></button>
    </div>

    <div class="act act-sub" id="actSub">
      <section class="sub" id="sub-memories">
        <header class="sub-head">
          <button class="sub-back" data-back>←</button>
          <h4>一些我记得的事情</h4>
        </header>
        <div class="mem-viewport"><div class="mem-deck" id="memDeck"></div></div>
        <div class="mem-nav">
          <button class="nav-btn" id="memPrev">←</button>
          <div class="mem-dots" id="memDots"></div>
          <button class="nav-btn" id="memNext">→</button>
        </div>
      </section>

      <section class="sub" id="sub-keywords">
        <header class="sub-head">
          <button class="sub-back" data-back>←</button>
          <h4>关于你的几个关键词</h4>
        </header>
        <div class="kw-list" id="kwList"></div>
      </section>

      <section class="sub" id="sub-words">
        <header class="sub-head">
          <button class="sub-back" data-back>←</button>
          <h4>我想对你说的话</h4>
        </header>
        <div class="words-paper" id="wordsPaper"></div>
      </section>
    </div>

    <div class="act act-5" id="act5">
      <div class="cake5-wrap" id="cake5Wrap">
        <svg viewBox="0 0 200 230" class="cake5-svg" aria-hidden="true">
          <ellipse cx="100" cy="202" rx="78" ry="10" fill="#000" fill-opacity=".28"/>
          <ellipse cx="100" cy="196" rx="72" ry="9" fill="#E7DEC9"/>
          <rect x="52" y="138" width="96" height="56" rx="10" fill="#F2E4D2" stroke="#4A3A32" stroke-width="2.2"/>
          <path d="M52 149q12 9 24 0t24 0 24 0 24 0" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
          <path d="M94 138V86h12v52" fill="#FF8A7A" stroke="#4A3A32" stroke-width="2.2"/>
          <line x1="100" y1="86" x2="100" y2="76" stroke="#4A3A32" stroke-width="2.4" stroke-linecap="round"/>
          <path class="smoke sm1" d="M96 70 q-6 -8 2 -16 q8 -8 0 -16" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2.2" stroke-linecap="round"/>
          <path class="smoke sm2" d="M104 68 q7 -8 -1 -16 q-8 -8 1 -15" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2.2" stroke-linecap="round"/>
          <g class="flame" id="candleFlame">
            <path d="M100 56c7 7 5.5 15 0 18-5.5-3-7-11 0-18z" fill="url(#flameGrad)"/>
            <path d="M100 63c3.2 3.4 2.6 7.5 0 9-2.6-1.5-3.2-5.6 0-9z" fill="#FFF6C8"/>
          </g>
          <defs>
            <radialGradient id="flameGrad" cx="50%" cy="65%" r="65%">
              <stop offset="0%" stop-color="#FFE9A8"/>
              <stop offset="60%" stop-color="#FFB347"/>
              <stop offset="100%" stop-color="#FF7A3D"/>
            </radialGradient>
          </defs>
        </svg>
        <p class="wish" id="wishText"></p>
        <div class="wish-done" id="wishDone">
          <h1 class="bday-big" id="bdayBig"></h1>
          <p class="final-line" id="finalLine"></p>
          <button class="open-btn light" id="wishBack">回到小宇宙 →</button>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- 浮动：退出 + 返回首页 -->
<button id="exitBtn" aria-label="退出当前场景">✕</button>
<button id="backHome" hidden><span id="backHomeText"></span></button>

<!-- 拍立得放大查看 -->
<div id="photoModal" hidden><div class="pm-card" id="pmCard"></div></div>

<!-- 六个全部看完后的彩蛋 -->
<div id="epilogue" hidden>
  <div class="epi-inner">
    <p class="epi-line" id="epiLine1"></p>
    <p class="epi-line big" id="epiLine2"></p>
    <button class="open-btn light" id="epiBtn"></button>
  </div>
</div>

<script src="js/content.js?v=4"></script>
<script src="js/fx.js?v=4"></script>
<script src="js/audio.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
